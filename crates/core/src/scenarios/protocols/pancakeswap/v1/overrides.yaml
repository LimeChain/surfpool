  # Token mints loaded from verified tokens registry
  token_mint:
    label: Token
    description: Select a token mint address from verified tokens
    source: verified_tokens

llm_context: |
  PancakeSwap CLMM, program HpNfyc2Saw7RKkQd8nEL4khUcuPhQ7WwY1B2qjx8jxFq, a fork of Raydium CLMM.

  FIND A POOL BY PAIR: resolve both mints with get_token_address, then call getProgramAccounts on the
  program with filters dataSize 1544 and memcmp of the two mints at offsets 73 and 105, once in each
  order (only one returns pools). Read each pool's token_vault_0 with dataSlice {offset 137, length
  32} and encoding base58, compare the vaults with getMultipleAccounts jsonParsed and keep the pool
  whose vault holds the most; name it. If neither order returns a pool, recheck the mints once, then
  ask for the pool address. A pool address the user gives is used as is.

  Set fetchBeforeUse: true.

  PRICE: sqrt_price_x64 = sqrt(price_raw) x 2^64, where price_raw is token_1 per token_0 in raw units,
  and tick_current = floor(log(price_raw) / log(1.0001)); set both together. A price move must also
  set liquidity to the active liquidity at the new tick, and the tick array covering the new tick must
  exist. The Studio price shock computes all three; prefer it to hand-computed values.

templates:
  - id: pancakeswap-clmm-custom
    name: Override CLMM Pool (By Fee Tier and Mints)
    description: |
      Override a PancakeSwap CLMM pool given its fee tier index and its two token mints.
      Both the AMM config address AND the pool address are dynamically derived:
      - AMM Config: PDA from ["amm_config", config_index.to_be_bytes()]
      - Pool: PDA from ["pool", amm_config, token_mint_0, token_mint_1]
    idl_account_name: PoolState
    properties:
      - path: liquidity
        label: Liquidity
        description: Total liquidity in the current tick range (raw u128, no decimals)
      - path: sqrt_price_x64
        label: Square Root Price (Q64.64)
        description: sqrt(token_1/token_0) in Q64.64 fixed point (raw u128); must agree with tick_current
      - path: tick_current
        label: Current Tick
        description: Tick index of the current price (i32); must agree with sqrt_price_x64
      - path: status
        label: Pool Status
        description: "Disable bitmask (u8): bit0 open/increase liquidity, bit1 decrease liquidity, bit2 collect fee, bit3 collect reward, bit4 swap; 0 = all enabled"
      - path: config_index
        type: constant_ref
        label: Fee Tier
        constant: amm_config_index
        description: Fee tier of the pool. Together with the two mints it selects the pool address.
      - path: token_mint_0
        type: constant_ref
        label: Token 0 Mint
        constant: token_mint
        description: First mint of the pair as the program stores it, the lower of the two by raw bytes.
      - path: token_mint_1
        type: constant_ref
        label: Token 1 Mint
        constant: token_mint
        description: Second mint of the pair as the program stores it, the higher of the two by raw bytes.
    llm_context: |
      Derives the pool from config_index and the two mints, from get_token_address (never program ids).
      token_mint_0 must be the mint whose raw 32 bytes are smaller (SOL before USDC); reversed mints
      derive an empty address and nothing checks it. For a pool found by address, use
      pancakeswap-clmm-pool-state.
    address:
      type: pda
      program_id: HpNfyc2Saw7RKkQd8nEL4khUcuPhQ7WwY1B2qjx8jxFq
      seeds:
        - type: string
          value: pool
        # Dynamically derive the AMM config PDA from the index
        - type: derived_pda
          program_id: HpNfyc2Saw7RKkQd8nEL4khUcuPhQ7WwY1B2qjx8jxFq
          seeds:
            - type: string
              value: amm_config
            - type: u16_be_ref
              value: config_index
        - type: property_ref
          value: token_mint_0
        - type: property_ref
          value: token_mint_1

  - id: pancakeswap-clmm-pool-state
    name: Override CLMM Pool State
    description: Override a PancakeSwap CLMM pool found by pair or by address
    idl_account_name: PoolState
    properties:
      - path: liquidity
        label: Liquidity
        description: Total liquidity in the current tick range (raw u128, no decimals)
      - path: sqrt_price_x64
        label: Square Root Price (Q64.64)
        description: sqrt(token_1/token_0) in Q64.64 fixed point (raw u128); must agree with tick_current
      - path: tick_current
        label: Current Tick
        description: Tick index of the current price (i32); must agree with sqrt_price_x64
      - path: status
        label: Pool Status
        description: "Disable bitmask (u8): bit0 open/increase liquidity, bit1 decrease liquidity, bit2 collect fee, bit3 collect reward, bit4 swap; 0 = all enabled"
    llm_context: |
      Put the pool in the override's account as {"pubkey":"<pool>"}, never in values.

      status is a bitmask of disabled operations: 16 disables swaps, 0 enables everything.
    address:
      type: pubkey

  - id: pancakeswap-clmm-amm-config
    name: Override CLMM Fee Tier (AmmConfig)
    description: |
      Override an AmmConfig fee tier for PancakeSwap CLMM. The address is a PDA derived
      from ["amm_config", index.to_be_bytes()]. Every pool created with this config
      index shares these fee rates.
    idl_account_name: AmmConfig
    properties:
      - path: trade_fee_rate
        label: Trade Fee Rate
        description: Fee on the input amount, parts per million (2500 = 0.25%); below 1,000,000
      - path: protocol_fee_rate
        label: Protocol Fee Rate
        description: Protocol treasury's share of the collected trade fee, parts per million
      - path: fund_fee_rate
        label: Fund Fee Rate
        description: Fund owner's share of the collected trade fee, parts per million
      - path: config_index
        type: constant_ref
        label: Fee Tier Index
        constant: amm_config_index
        description: Fee tier whose AmmConfig account is overridden. The address derives from this index.
    llm_context: |
      To change the fees of a pool's tier, read the pool's amm_config with getAccountInfo, dataSlice
      {offset 9, length 32} and encoding base58, and pick the config_index option whose derived_address
      matches. Every pool on the tier shares the account.

      Rates are parts per million: trade_fee_rate of the input (2500 = 0.25%, below 1,000,000);
      protocol_fee_rate and fund_fee_rate of the collected fee, together at most 1,000,000.
    address:
      type: pda
      program_id: HpNfyc2Saw7RKkQd8nEL4khUcuPhQ7WwY1B2qjx8jxFq
      seeds:
        - type: string
          value: amm_config
        - type: u16_be_ref
          value: config_index
