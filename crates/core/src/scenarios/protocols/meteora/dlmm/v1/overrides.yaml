protocol: Meteora
version: v1
account_type: LbPair
idl_file_path: idl.json

tags:
  - dlmm
  - amm
  - concentrated-liquidity
  - defi

templates:
  - id: meteora-dlmm-custom
    name: Override DLMM Pool (Custom)
    description: >-
      Override any Meteora DLMM pool by passing its LbPair address: its price bin, its status
      and its fees.
    idl_account_name: LbPair
    properties:
      - path: active_id
        label: Active Bin ID
        description: >-
          Bin the pool trades in, a raw signed 32-bit bin index.
          price = (1 + bin_step / 10000) ^ active_id in token Y per token X, before decimals;
          multiply by 10 ^ (decimals_x - decimals_y) for the human price.
      - path: status
        label: Pair Status
        description: >-
          PairStatus as a raw u8: 0 enabled, 1 disabled. A disabled pair rejects swaps.
      - path: parameters.base_factor
        label: Base Fee Factor
        description: >-
          Raw u16 setting the base swap fee.
          base_fee_rate = base_factor * bin_step * 10 * 10 ^ base_fee_power_factor, in units of
          1e-9, so with base_fee_power_factor 0 the fee fraction is base_factor * bin_step * 1e-8.
      - path: v_parameters.volatility_accumulator
        label: Volatility Accumulator
        description: >-
          Raw u32 driving the variable fee charged on top of the base fee; one bin crossed is
          10000. Capped by parameters.max_volatility_accumulator.
    llm_context: |
      Set fetchBeforeUse: true so the live account is forked first; false only for a later
      override that builds on state an earlier override in the same scenario prepared.

      PICKING A POOL: pass the LbPair address as the account. Find one at
      https://dlmm.datapi.meteora.ag/pools (filter by mint or bin step). Confirm the address
      before using it: the account must be owned by LBUZKhRxPF3XUpBCjp4YzTKgLccjZhTSDM9YuVaPwxo,
      904 bytes, discriminator 21 0b 31 62 b5 65 b1 0d. A well-known example is the SOL/USDC
      pair at BGm1tav58oGcsQJehL9WXBFXF7D27vZsKefj4xJKD5Y (bin step 10).

      PRICE: price = (1 + bin_step / 10000) ^ active_id * 10 ^ (decimals_x - decimals_y), where
      bin_step is the pool's own (the u16 at offset 80). Read the live active_id first: it is a
      signed bin index that is often negative, and every bin step has a different bin scale. To
      move the price by a factor f, add round(ln(f) / ln(1 + bin_step / 10000)) to the live value.

      MOVING active_id IS NOT ENOUGH ON ITS OWN. A swap walks BinArray accounts, so the array
      covering the new active bin must already exist and hold liquidity, otherwise the swap
      fails or returns nothing. That array is the PDA ["bin_array", lb_pair,
      floor(active_id / 70) as i64 LE] under LBUZKhRxPF3XUpBCjp4YzTKgLccjZhTSDM9YuVaPwxo
      (10136 bytes, floored division: active_id -2222 is index -32, not -31). Check it exists
      before choosing a target bin; small moves that stay inside the current array are the safe
      ones.

      FEES: total fee = base fee + variable fee. The base fee fraction is
      base_factor * bin_step * 1e-8 while parameters.base_fee_power_factor is 0, so 10000 at
      bin step 10 is 0.1%. The variable fee grows with v_parameters.volatility_accumulator,
      which the program recomputes on every swap from the distance to
      v_parameters.index_reference (one bin = 10000), so an override of it only holds until the
      next swap. base_factor is the durable fee lever.

      STATUS: 0 enabled, 1 disabled. Set 1 to prove a router reacts to a dead pool.

      bin_step is deliberately not exposed. It is the base of the bin math and a PDA seed of
      the pool address, so changing it would leave a pool that no longer derives its own
      address and whose every bin price silently moves. Pick a different pool instead.
    address:
      type: pubkey
