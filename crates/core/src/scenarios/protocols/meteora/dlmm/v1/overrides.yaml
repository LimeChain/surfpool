protocol: Meteora
version: v1
account_type: LbPair
idl_file_path: idl.json

tags:
  - dlmm
  - amm
  - concentrated-liquidity
  - defi

llm_context: |
  Meteora DLMM, program LBUZKhRxPF3XUpBCjp4YzTKgLccjZhTSDM9YuVaPwxo.

  FIND A POOL BY PAIR: resolve both mints with get_token_address, then call getProgramAccounts on the
  program with filters dataSize 904 and memcmp of the two mints at offsets 88 and 120, once in each
  order (a pair can have pools in both). Read each pool's vault of the first mint with dataSlice
  {offset 152, length 32} and encoding base58 (184 in the second order), compare the vaults with
  getMultipleAccounts jsonParsed and keep the pool whose vault holds the most; name it. If neither
  order returns a pool, recheck the mints once, then ask for the pool address. A pool address the
  user gives is used as is.

  Set fetchBeforeUse: true. Put the pool in the override's account as {"pubkey":"<pool>"}, never in
  values. All values are raw on-chain units.

templates:
  - id: meteora-dlmm-pool-state
    name: Override DLMM Pool State
    description: Override a Meteora DLMM pool found by pair or by address, its price bin, status and fees
    idl_account_name: LbPair
    properties:
      - path: active_id
        label: Active Bin ID
        description: Bin the pool trades in, a raw signed i32 bin index (often negative).
      - path: v_parameters.index_reference
        label: Variable Fee Bin Reference
        description: Bin the variable fee measures moves from, a raw signed i32 bin index; follows active_id after a price move.
      - path: status
        label: Pool Status
        description: PairStatus, raw u8 - 0 enabled, 1 disabled (swaps rejected).
      - path: parameters.base_factor
        label: Base Fee Factor
        description: Base swap fee factor, raw u16 (10000 at bin step 10 is a 0.1% fee while base_fee_power_factor is 0).
      - path: v_parameters.volatility_accumulator
        label: Volatility Accumulator
        description: Variable-fee driver, raw u32, 10000 per bin crossed; recomputed on every swap.
    llm_context: |
      status: 0 enabled, 1 disabled (swaps rejected).

      PRICE: price = (1 + bin_step / 10000) ^ active_id x 10 ^ (decimals_x - decimals_y), token Y per
      token X; active_id is signed. Moving it moves one side only: bins above the active bin hold X
      and bins below hold Y, so after a rise buys fill at the new price and sells at the old one, and
      the reverse after a drop. The bin array covering the new active bin must exist. A price move
      also sets v_parameters.index_reference to the new active_id; left on the old bin, the next
      swaps count the whole move as volatility and pay up to the maximum variable fee. The Studio
      price shock picks a valid bin and sets both; prefer it to hand-computed values.

      FEES: the base fee is base_factor x bin_step x 1e-8 while parameters.base_fee_power_factor is 0.
      The program recomputes v_parameters.volatility_accumulator on every swap, so base_factor is the
      durable fee lever.
    address:
      type: pubkey
