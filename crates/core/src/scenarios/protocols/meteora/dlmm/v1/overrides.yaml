protocol: Meteora
version: v1
account_type: LbPair
idl_file_path: idl.json

tags:
  - dlmm
  - amm
  - concentrated-liquidity
  - defi

templates:
  - id: meteora-dlmm-pool-state
    name: Override DLMM Pool State (By Address)
    description: >-
      Override any Meteora DLMM pool by passing its LbPair address: its price bin, its status
      and its fees.
    idl_account_name: LbPair
    properties:
      - path: active_id
        label: Active Bin ID
        description: Bin the pool trades in, a raw signed i32 bin index (often negative).
      - path: status
        label: Pool Status
        description: PairStatus, raw u8 - 0 enabled, 1 disabled (swaps rejected).
      - path: parameters.base_factor
        label: Base Fee Factor
        description: Base swap fee factor, raw u16 (10000 at bin step 10 is a 0.1% fee).
      - path: v_parameters.volatility_accumulator
        label: Volatility Accumulator
        description: Variable-fee driver, raw u32, 10000 per bin crossed; recomputed on every swap.
    llm_context: |
      Set fetchBeforeUse: true so the live account is forked first; false only for a later
      override that builds on state an earlier override in the same scenario prepared.
      All values are raw on-chain units; nothing is scaled.

      PICKING A POOL: pass the LbPair address as the account. Find one at
      https://dlmm.datapi.meteora.ag/pools (filter by mint or bin step). The account must be
      owned by LBUZKhRxPF3XUpBCjp4YzTKgLccjZhTSDM9YuVaPwxo, 904 bytes, discriminator
      21 0b 31 62 b5 65 b1 0d. Example: SOL/USDC at BGm1tav58oGcsQJehL9WXBFXF7D27vZsKefj4xJKD5Y
      (bin step 10).

      PRICE: price = (1 + bin_step / 10000) ^ active_id * 10 ^ (decimals_x - decimals_y), in
      token Y per token X, where bin_step is the pool's own (the u16 at offset 80). Read the
      live active_id first: it is signed and often negative. To move the price by a factor f,
      add round(ln(f) / ln(1 + bin_step / 10000)) to the live value.

      MOVING active_id IS NOT ENOUGH ON ITS OWN. A swap walks BinArray accounts, so the array
      covering the new active bin must exist and hold liquidity. That array is the PDA ["bin_array", lb_pair,
      index as i64 little-endian] under LBUZKhRxPF3XUpBCjp4YzTKgLccjZhTSDM9YuVaPwxo, 70 bins
      per array, index = floor(active_id / 70) (floored: active_id -2222 is index -32, not
      -31). The destination array must exist: check it with getAccountInfo on the derived
      PDA; a null result means the swap will fail.

      ONE SIDE ONLY: bins above the active bin hold token X and bins below hold token Y, and
      this override moves active_id without moving those balances. After a rise, buys of X
      fill at the new price, but the new bin and every skipped bin hold no Y, so sells skip
      them and fill back at the old price. After a drop it is the reverse. Pick the direction
      that matches the side the test trades.

      FEES: total fee = base fee + variable fee. The base fee fraction is
      base_factor * bin_step * 1e-8 while parameters.base_fee_power_factor is 0. The variable
      fee grows with v_parameters.volatility_accumulator, which the program recomputes on every
      swap from the distance to v_parameters.index_reference (one bin = 10000), so an override
      of it only holds until the next swap. base_factor is the durable fee lever.

      STATUS: 0 enabled, 1 disabled. Set 1 to prove a router reacts to a dead pool.

      bin_step is not exposed: it is the base of the bin math and a seed of the pool address.
      To test a different bin step, pick a different pool.
    address:
      type: pubkey
