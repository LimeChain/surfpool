protocol: Raydium
version: v4
account_type: AmmInfo
idl_file_path: idl.json

tags:
  - amm
  - constant-product
  - defi

llm_context: |
  Raydium AMM v4, program 675kPX9MHTjS2zt1qfr1NYHuzeLXfQM9H24wFSUt1Mp8. Pools are keypair accounts
  (AmmInfo, 752 bytes); put the pool in the override's account as {"pubkey":"<pool>"}, never in
  values.

  FIND A POOL BY PAIR: resolve both mints with get_token_address, then call getProgramAccounts on the
  program with filters dataSize 752 and memcmp of the two mints at offsets 400 and 432, once in each
  order (a pair can have pools in both). Read each pool's vault of the first mint with dataSlice
  {offset 336, length 32} and encoding base58 (368 in the second order), compare the vaults with
  getMultipleAccounts jsonParsed and keep the pool whose vault holds the most; name it. If neither
  order returns a pool, recheck the mints once, then ask for the pool address. A pool address the user
  gives is used as is.

  Set fetchBeforeUse: true. The price is not in this account: a swap prices off the vault token
  accounts token_coin and token_pc, which spl-token-account-balance overrides.

templates:
  - id: raydium-amm-pool-state
    name: Override AMM Pool State
    description: Override a Raydium AMM v4 pool's trading status, machine state and LP supply
    idl_account_name: AmmInfo
    properties:
      - path: status
        label: Pool Status
        description: >-
          Which operations the program allows: 0 uninitialized, 1 initialized, 2 disabled,
          3 withdraw only, 4 liquidity only, 5 orderbook only, 6 swap only, 7 waiting trade
      - path: state
        label: Machine State
        description: >-
          Orderbook state machine position: 0 invalid, 1 idle, 2 cancel all orders,
          3 plan orders, 4 cancel order, 5 place orders, 6 purge order
      - path: lp_amount
        label: LP Supply
        description: LP tokens the pool has minted, in raw units of the LP mint
    llm_context: |
      status (u64): swaps run at 1 (initialized), 6 (swap only) and 7 (waiting trade, once the cluster
      clock passes out_put.pool_open_time). 2 disabled, 3 withdraw only, 4 liquidity only and 5 orderbook
      only reject swaps with InvalidStatus. Keep status in 0..=7 and state in 0..=6; a larger value aborts
      every instruction on the pool. lp_amount sizes deposits only.
    address:
      type: pubkey

  - id: raydium-amm-fees
    name: Override AMM Fees
    description: Override a Raydium AMM v4 pool's swap and trade fee rates
    idl_account_name: AmmInfo
    properties:
      - path: fees.swap_fee_numerator
        label: Swap Fee Numerator
        description: Numerator of the fee every swap charges on its input amount
      - path: fees.swap_fee_denominator
        label: Swap Fee Denominator
        description: Denominator of the swap fee; 25/10000 is the mainnet default of 0.25%
      - path: fees.trade_fee_numerator
        label: Trade Fee Numerator
        description: Numerator of the fee the OpenBook order planner prices its orders with
      - path: fees.trade_fee_denominator
        label: Trade Fee Denominator
        description: Denominator of the trade fee; 25/10000 is the mainnet default of 0.25%
    llm_context: |
      Each fee is a numerator over a denominator; override both of a pair together. Swaps charge
      ceil(amount_in * swap_fee_numerator / swap_fee_denominator) and read only fees.swap_fee_*; the
      trade_fee_* pair prices OpenBook orders. The mainnet default is 25/10000 = 0.25%; a numerator of 0
      makes swaps free.
    address:
      type: pubkey

  - id: raydium-amm-swap-stats
    name: Override AMM Swap Statistics
    description: Override a Raydium AMM v4 pool's cumulative swap counters and open time
    idl_account_name: AmmInfo
    properties:
      - path: out_put.swap_coin_in_amount
        label: Cumulative Coin In
        description: Running total of coin taken in by swaps, in raw units of the coin mint
      - path: out_put.swap_pc_out_amount
        label: Cumulative PC Out
        description: Running total of pc paid out by swaps, in raw units of the pc mint
      - path: out_put.swap_pc_in_amount
        label: Cumulative PC In
        description: Running total of pc taken in by swaps, in raw units of the pc mint
      - path: out_put.swap_coin_out_amount
        label: Cumulative Coin Out
        description: Running total of coin paid out by swaps, in raw units of the coin mint
      - path: out_put.pool_open_time
        label: Pool Open Time
        description: Unix timestamp from which a pool with status 7 accepts swaps
    llm_context: |
      The four out_put.swap_* counters are lifetime totals in raw mint units; no instruction prices off
      them. out_put.pool_open_time (unix seconds) matters only at status 7: swaps before it fail, and the
      first swap after it sets status to 6.
    address:
      type: pubkey
