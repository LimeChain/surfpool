protocol: Raydium
version: v4
account_type: AmmInfo
idl_file_path: idl.json

tags:
  - amm
  - constant-product
  - defi

templates:
  - id: raydium-amm-pool-state
    name: Override AMM Pool State
    description: Override a Raydium AMM v4 pool's trading status, machine state and LP supply
    idl_account_name: AmmInfo
    properties:
      - path: status
        label: Pool Status
        description: >-
          Which operations the program allows: 0 uninitialized, 1 initialized, 2 disabled,
          3 withdraw only, 4 liquidity only, 5 orderbook only, 6 swap only, 7 waiting trade
      - path: state
        label: Machine State
        description: >-
          Orderbook state machine position: 0 invalid, 1 idle, 2 cancel all orders,
          3 plan orders, 4 cancel order, 5 place orders, 6 purge order
      - path: lp_amount
        label: LP Supply
        description: LP tokens the pool has minted, in raw units of the LP mint
    llm_context: |
      Trading status of a Raydium AMM v4 pool (program
      675kPX9MHTjS2zt1qfr1NYHuzeLXfQM9H24wFSUt1Mp8). Use it to open or close a pool to
      swaps without touching its liquidity.

      FETCH RULE: set fetchBeforeUse: true so the live account is forked first; false only
      for a later override that builds on state an earlier override in the same scenario
      prepared.

      ADDRESS: pass the pool account (AmmInfo, 752 bytes). AMM v4 pools are keypair
      accounts, not PDAs, so there is nothing to derive. The `pool` constant lists the
      deepest live pools by TVL with their mints and OpenBook market id in metadata; any
      other v4 pool address works as well.

      STATUS (u64, raw): swap_base_in and swap_base_out run only at 1 (initialized), 6
      (swap only) and 7 (waiting trade). 7 additionally requires the cluster clock to have
      passed out_put.pool_open_time, and the program then rewrites status to 6 itself. 2
      (disabled), 3 (withdraw only), 4 (liquidity only) and 5 (orderbook only) all make a
      swap fail with InvalidStatus, which is the point of this template. Keep the value in
      0..=7: the program maps status through an exhaustive match that panics on anything
      else, so a larger number aborts every instruction that reads the pool.

      MACHINE STATE (u64, raw): drives the pool's OpenBook order planning, not swaps. Same
      bound applies - keep it in 0..=6.

      LP SUPPLY (u64, raw units of the LP mint): the deposit path reads it to size the LP
      tokens it mints, and a zero supply makes a deposit take the initialising branch. It
      does not enter the swap price.

      PRICE IS NOT IN THIS ACCOUNT: a swap prices off the live vault balances (the coin
      vault minus out_put.need_take_pnl_coin, the pc vault minus
      out_put.need_take_pnl_pc), so the price lever is the vault token accounts through the
      spl-token-account-balance template. The vault addresses are the AmmInfo fields
      token_coin and token_pc.
    address:
      type: pubkey

  - id: raydium-amm-fees
    name: Override AMM Fees
    description: Override a Raydium AMM v4 pool's swap and trade fee rates
    idl_account_name: AmmInfo
    properties:
      - path: fees.swap_fee_numerator
        label: Swap Fee Numerator
        description: Numerator of the fee every swap charges on its input amount
      - path: fees.swap_fee_denominator
        label: Swap Fee Denominator
        description: Denominator of the swap fee; 25/10000 is the mainnet default of 0.25%
      - path: fees.trade_fee_numerator
        label: Trade Fee Numerator
        description: Numerator of the fee the OpenBook order planner prices its orders with
      - path: fees.trade_fee_denominator
        label: Trade Fee Denominator
        description: Denominator of the trade fee; 25/10000 is the mainnet default of 0.25%
    llm_context: |
      Fee rates of a Raydium AMM v4 pool (program
      675kPX9MHTjS2zt1qfr1NYHuzeLXfQM9H24wFSUt1Mp8). Use it to make swaps cost more or
      nothing at all and watch the output amount move.

      FETCH RULE: set fetchBeforeUse: true so the live account is forked first; false only
      for a later override that builds on state an earlier override in the same scenario
      prepared.

      ADDRESS: pass the pool account (AmmInfo, 752 bytes). AMM v4 pools are keypair
      accounts, not PDAs. The `pool` constant lists the deepest live pools by TVL.

      UNITS AND GROUPING: each fee is a raw u64 numerator over a raw u64 denominator, and
      the two are one group - override both or neither, because a numerator left against
      the other pair's denominator is a silently different rate. The swap charges
      ceil(amount_in * swap_fee_numerator / swap_fee_denominator) on the input before
      pricing the remainder against the reserves. 25/10000 = 0.25% is the mainnet default.
      A numerator of 0 makes swaps free; a numerator at or above the denominator consumes
      the whole input and the swap returns nothing.

      WHICH PAIR THE SWAP READS: swap_base_in and swap_base_out read fees.swap_fee_* only.
      fees.trade_fee_* is read by the OpenBook order-planning path when the pool quotes on
      the orderbook, so overriding it alone changes no swap result.

      PRICE IS NOT IN THIS ACCOUNT: a swap prices off the live vault balances (the coin
      vault minus out_put.need_take_pnl_coin, the pc vault minus
      out_put.need_take_pnl_pc), so the price lever is the vault token accounts through the
      spl-token-account-balance template. The vault addresses are the AmmInfo fields
      token_coin and token_pc.
    address:
      type: pubkey

  - id: raydium-amm-swap-stats
    name: Override AMM Swap Statistics
    description: Override a Raydium AMM v4 pool's cumulative swap counters and open time
    idl_account_name: AmmInfo
    properties:
      - path: out_put.swap_coin_in_amount
        label: Cumulative Coin In
        description: Running total of coin taken in by swaps, in raw units of the coin mint
      - path: out_put.swap_pc_out_amount
        label: Cumulative PC Out
        description: Running total of pc paid out by swaps, in raw units of the pc mint
      - path: out_put.swap_pc_in_amount
        label: Cumulative PC In
        description: Running total of pc taken in by swaps, in raw units of the pc mint
      - path: out_put.swap_coin_out_amount
        label: Cumulative Coin Out
        description: Running total of coin paid out by swaps, in raw units of the coin mint
      - path: out_put.pool_open_time
        label: Pool Open Time
        description: Unix timestamp from which a pool with status 7 accepts swaps
    llm_context: |
      Lifetime swap counters and the open time of a Raydium AMM v4 pool (program
      675kPX9MHTjS2zt1qfr1NYHuzeLXfQM9H24wFSUt1Mp8). Use it to hand an indexer or a
      dashboard a pool with a chosen trading history, or to open a scheduled pool early.

      FETCH RULE: set fetchBeforeUse: true so the live account is forked first; false only
      for a later override that builds on state an earlier override in the same scenario
      prepared.

      ADDRESS: pass the pool account (AmmInfo, 752 bytes). AMM v4 pools are keypair
      accounts, not PDAs. The `pool` constant lists the deepest live pools by TVL.

      UNITS: the four swap_* counters are raw u128 totals in the smallest unit of their
      mint (coin = the mintA side, pc = the mintB side), and the program only ever adds to
      them. They are bookkeeping - no instruction prices off them, so changing them moves
      no swap output. Their natural groups are the two directions: coin in with pc out, pc
      in with coin out. Leaving one side of a direction untouched produces a pool whose
      recorded history has no average price.

      POOL OPEN TIME (u64, unix seconds): read only while status is 7 (waiting trade). A
      swap before it fails with InvalidStatus; the first swap at or after it flips the
      pool's status to 6 (swap only). Set it into the past together with
      raydium-amm-pool-state status 7 to model a launch that is about to open, or leave it
      alone on a pool that already trades.

      PRICE IS NOT IN THIS ACCOUNT: a swap prices off the live vault balances (the coin
      vault minus out_put.need_take_pnl_coin, the pc vault minus
      out_put.need_take_pnl_pc), so the price lever is the vault token accounts through the
      spl-token-account-balance template. The vault addresses are the AmmInfo fields
      token_coin and token_pc.
    address:
      type: pubkey
