protocol: jupiter-perps-doves
version: v1
account_type: AgPriceFeed
idl_file_path: idl.json

tags:
  - oracle
  - price-feed
  - perpetuals
  - defi

keep_alive:
  - template: jupiter-perps-doves-publication
    address: { type: override }
    values: { timestamp: $unix_s }

templates:
  - id: jupiter-perps-doves-price
    name: Override Perps Oracle Price
    description: Override the Doves price Jupiter Perps reads for one asset; keeps that feed published
    idl_account_name: AgPriceFeed
    properties:
      - path: price
        label: Price
        description: "Price mantissa; the USD price is price x 10^expo. Example: 8000000000 is $80 at expo -8"
      - path: timestamp
        label: Publish time
        description: 'Unix seconds the price was published. Keep-alive writes the Clock time every slot, so a value set here holds only on an override with "keepAlive": []; set it alone to keep the feed published at its price'
    address:
      type: pubkey
    llm_context: |
      Jupiter Perps prices every market from a Doves AgPriceFeed, and this template moves that
      price. Liquidations, JLP deposits and quotes all read it. Perps never reads the custody's
      Pyth account, so pyth-price-feed-v2 does not move Perps.

      FIND THE FEED (read it live, nothing is hardcoded):
      1. getAccountInfo on the JLP Pool 5BUwFW4nRbftYTDMbgxykoFWqWHPzahFSNAaaaJtVKsq with
         encoding jsonParsed. result.value.data.parsed.custodies lists every custody.
      2. getMultipleAccounts on those custodies with jsonParsed. Take the custody whose mint is
         the asset's mint; its doves_ag_oracle is this template's address.

      SET THE PRICE:
      - price = usd_price x 10^-expo; read expo from the feed and keep it.
        $80.00 -> 8000000000
      - Set fetchBeforeUse: true so the feed's other fields keep their live values, and false
        on a later override of the same feed in another scenario or slot: a reload drops the
        earlier local change.

      THE FEED STAYS PUBLISHED. From the slot an override of this template plays, Surfpool
      republishes the feed it wrote every slot at the Surfnet clock's time, as the Doves publisher
      does on mainnet. Feeds no override wrote are not republished and age against the Surfnet
      clock. A JLP deposit, withdrawal, swap or quote reads every custody's feed and fails with
      error 6003 once one is older than its custody's oracle.max_price_age_sec.

      EVERY FEED FRESH: add one override of this template per Doves feed the transaction reads,
      in the same scenario and slot. A JLP deposit, withdrawal, swap or quote reads every
      custody's doves_ag_oracle. On a feed whose price must not move, set only timestamp;
      keep-alive rewrites it with the clock time in the same slot, so its value does not matter.

      STALE PRICE: leave the stale feed out of those overrides. It then ages against the Surfnet
      clock while the others stay published. A feed an earlier override keeps published ages from
      the slot of a later override of it with "keepAlive": [] and a value, such as timestamp at
      the Surfnet clock's time.

      LIQUIDATIONS: a keeper liquidates a position once collateral + PnL - close and borrow
      fees falls below size x 10000 / the custody's pricing.max_leverage. Move a long's price
      below its liquidation price, or a short's above it. A cascade is one override per asset
      in the same slot.

      JLP PRICE GUARD: a shock that moves the JLP price more than the pool's
      max_lp_token_price_change_bps (500 = 5%) refuses JLP deposits (error 6066), so a large shock
      on a heavily weighted token such as SOL trips it. Raise the limit with
      jupiter-perps-pool-limits.

      EXAMPLE - SOL crashes to $80:
      price: 8000000000
