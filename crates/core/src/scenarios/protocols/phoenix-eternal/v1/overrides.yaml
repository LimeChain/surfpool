protocol: Phoenix Eternal
version: v1
account_type: Trader
idl_file_path: idl.json

tags:
  - perpetuals
  - collateral
  - risk

templates:
  - id: phoenix-trader-collateral-stress
    name: Phoenix Trader Collateral Stress
    description: Set exact signed quote-lot collateral on a Phoenix Trader and its effective GlobalTraderIndex entry when hot.
    idl_account_name: Trader
    properties:
      - path: traderState.quoteLotCollateral
        label: Target Collateral in Quote Lots
        description: Exact signed quote-lot collateral encoded as a decimal string
    llm_context: |
      This prepares collateral stress state. It does not execute liquidation.
      Only lower collateral; raising it needs a real deposit into the global vault.
      For a liquidation cascade, put this override at slot 0 and phoenix-direct-mark-risk-shock at slot 1 in one create_scenario call.
      Keep override labels short. Pass traderState.quoteLotCollateral as a decimal string.
    address:
      type: pubkey

  - id: phoenix-direct-mark-risk-shock
    name: Phoenix Direct Mark Risk Shock
    description: Set exact mark-price ticks for one market in a validated Phoenix Eternal PerpAssetMap.
    idl_account_name: PerpAssetMap
    properties:
      - path: symbol
        value_type: string
        type: dynamic_ref
        label: Market Symbol
        source: list_phoenix_markets
        description: Exact Phoenix market symbol
      - path: target_ticks
        value_type: string
        label: Target Mark Ticks
        description: Exact unsigned mark-price ticks encoded as a decimal string
    llm_context: |
      This directly changes Phoenix risk state, setting the mark ticks and stamping the mark slot with the materialization slot. It does not simulate an oracle, orderbook, spline, or trade.
      Pass target_ticks as a decimal string. The account is the singleton PerpAssetMap, so this template carries its address.
      Set fetchBeforeUse: true so the live asset map is forked first; use false only for a later
      override that builds on state an earlier one prepared in the same scenario.
    address:
      type: pubkey
      value: 2nHGAaEw3D5dd4hVueaUNoygkQFmoeKqRQWnSPqSMFUC

  - id: phoenix-maintenance-margin-stress
    name: Phoenix Maintenance Margin Stress
    description: Set the maintenance margin risk factor for one market in the Phoenix Eternal PerpAssetMap.
    idl_account_name: PerpAssetMap
    properties:
      - path: symbol
        value_type: string
        type: dynamic_ref
        label: Market Symbol
        source: list_phoenix_markets
        description: Exact Phoenix market symbol
      - path: maintenance_risk_factor_bps
        value_type: string
        label: Maintenance Risk Factor (bps)
        description: Maintenance margin risk factor in basis points, encoded as a decimal string
    llm_context: |
      This changes how much collateral positions in one market need to stay healthy. It does not change prices, collateral or positions, and does not execute liquidation.
      The maintenance margin scales linearly with the factor. Live markets use 5000, so 10000 doubles and 15000 triples the requirement.
      Pass the factor as a decimal string. The account is the singleton PerpAssetMap, so this template carries its address.
      Set fetchBeforeUse: true so the live asset map is forked first; use false only for a later
      override that builds on state an earlier one prepared in the same scenario.
    address:
      type: pubkey
      value: 2nHGAaEw3D5dd4hVueaUNoygkQFmoeKqRQWnSPqSMFUC
