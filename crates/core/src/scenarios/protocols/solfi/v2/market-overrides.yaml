    llm_context: |
      PRECONDITION - THE ORACLE MUST BE CURRENT. Apply solfi-freshness when setup spans multiple
      slots, otherwise expiry can hide a correctly materialized size curve. If the scenario runs
      beyond the configured validity horizon, schedule another freshness override in each later slot
      where a quote is needed.

      This is the advanced form of SolFi spread control. It preserves the eight x breakpoints that
      are already configured on the live market and replaces their y values. The deployed program
      linearly interpolates between adjacent points and clamps to the endpoint outside the populated
      range. The x axis is raw quote-token notional: quote-to-base uses the quote input directly,
      while base-to-quote converts the base input at the oracle price before lookup. Do not assume
      that different markets use the same x values.

      Direction 1 (quote to base / buy base) reads quote_to_base_y_0 through _7. Direction 0 (base
      to quote / sell base) reads base_to_quote_y_0 through _7. Values should normally be
      non-decreasing when simulating execution that deteriorates with trade size.

      Set age_multiplier_curve_y to 1000 and additional_widening_curve_y to 0 when the goal is to
      isolate size impact. The same oracle scale and 1/10000000 final unit described by
      solfi-spread apply here. Set max_widening high enough not to flatten the requested curve.

      HOW TO USE: set all eight y values for each direction you care about. A conventional
      large-trade deterioration uses non-decreasing values. Do not copy x assumptions between
      markets: this template deliberately leaves the operator's live x breakpoints untouched.
