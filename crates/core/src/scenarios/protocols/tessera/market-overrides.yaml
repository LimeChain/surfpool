      - { path: sell_level_18_factor, offset: 600, encoding: u64, label: "Sell level 19 output factor", description: "Output factor of this level, 1000000 neutral; must be lower than the previous level's factor." }
      - { path: sell_level_19_factor, offset: 624, encoding: u64, label: "Sell level 20 output factor", description: "Output factor of this level, 1000000 neutral; must be lower than the previous level's factor." }
