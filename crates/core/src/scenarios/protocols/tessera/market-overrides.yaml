      - { path: buy_level_1_amount, offset: 664, encoding: u64, label: "Buy level 2 capacity", description: "Capacity of this level in input-token atoms; scale it, and keep it nonzero where the maker quotes." }
      - { path: buy_level_2_amount, offset: 688, encoding: u64, label: "Buy level 3 capacity", description: "Capacity of this level in input-token atoms; scale it, and keep it nonzero where the maker quotes." }
      - { path: buy_level_3_amount, offset: 712, encoding: u64, label: "Buy level 4 capacity", description: "Capacity of this level in input-token atoms; scale it, and keep it nonzero where the maker quotes." }
      - { path: buy_level_4_amount, offset: 736, encoding: u64, label: "Buy level 5 capacity", description: "Capacity of this level in input-token atoms; scale it, and keep it nonzero where the maker quotes." }
      - { path: buy_level_5_amount, offset: 760, encoding: u64, label: "Buy level 6 capacity", description: "Capacity of this level in input-token atoms; scale it, and keep it nonzero where the maker quotes." }
      - { path: buy_level_6_amount, offset: 784, encoding: u64, label: "Buy level 7 capacity", description: "Capacity of this level in input-token atoms; scale it, and keep it nonzero where the maker quotes." }
      - { path: buy_level_7_amount, offset: 808, encoding: u64, label: "Buy level 8 capacity", description: "Capacity of this level in input-token atoms; scale it, and keep it nonzero where the maker quotes." }
      - { path: buy_level_8_amount, offset: 832, encoding: u64, label: "Buy level 9 capacity", description: "Capacity of this level in input-token atoms; scale it, and keep it nonzero where the maker quotes." }
      - { path: buy_level_9_amount, offset: 856, encoding: u64, label: "Buy level 10 capacity", description: "Capacity of this level in input-token atoms; scale it, and keep it nonzero where the maker quotes." }
      - { path: buy_level_10_amount, offset: 880, encoding: u64, label: "Buy level 11 capacity", description: "Capacity of this level in input-token atoms; scale it, and keep it nonzero where the maker quotes." }
      - { path: buy_level_11_amount, offset: 904, encoding: u64, label: "Buy level 12 capacity", description: "Capacity of this level in input-token atoms; scale it, and keep it nonzero where the maker quotes." }
      - { path: buy_level_12_amount, offset: 928, encoding: u64, label: "Buy level 13 capacity", description: "Capacity of this level in input-token atoms; scale it, and keep it nonzero where the maker quotes." }
      - { path: buy_level_13_amount, offset: 952, encoding: u64, label: "Buy level 14 capacity", description: "Capacity of this level in input-token atoms; scale it, and keep it nonzero where the maker quotes." }
      - { path: buy_level_14_amount, offset: 976, encoding: u64, label: "Buy level 15 capacity", description: "Capacity of this level in input-token atoms; scale it, and keep it nonzero where the maker quotes." }
      - { path: buy_level_15_amount, offset: 1000, encoding: u64, label: "Buy level 16 capacity", description: "Capacity of this level in input-token atoms; scale it, and keep it nonzero where the maker quotes." }
      - { path: buy_level_16_amount, offset: 1024, encoding: u64, label: "Buy level 17 capacity", description: "Capacity of this level in input-token atoms; scale it, and keep it nonzero where the maker quotes." }
      - { path: buy_level_17_amount, offset: 1048, encoding: u64, label: "Buy level 18 capacity", description: "Capacity of this level in input-token atoms; scale it, and keep it nonzero where the maker quotes." }
      - { path: buy_level_18_amount, offset: 1072, encoding: u64, label: "Buy level 19 capacity", description: "Capacity of this level in input-token atoms; scale it, and keep it nonzero where the maker quotes." }
      - { path: buy_level_19_amount, offset: 1096, encoding: u64, label: "Buy level 20 capacity", description: "Capacity of this level in input-token atoms; scale it, and keep it nonzero where the maker quotes." }
    llm_context: |
      The target account is chosen through account.pubkey (a market option's value); never put a market key in values.
      PRECONDITION - THE QUOTE MUST BE FRESH. Apply tessera-freshness with last_update_slot 0,
      otherwise the swap rejects with custom error 65535 and the new depth is never used.

      Set fetchBeforeUse: true so the live account is forked first; false only for a later override
      that builds on state an earlier override in the same scenario prepared.

      Each side is a ladder of twenty 24-byte levels: a u64 capacity at +0, a u64 output factor at
      +8 and a u8 enabled flag at +16. The sell ladder starts at 160 and fills base-to-quote sells
      (capacity in base atoms); the buy ladder starts at 640 and fills quote-to-base buys (capacity
      in quote atoms). Capacities are directional quoting limits, not vault balances.

      Only enabled levels quote, and how many are enabled differs per market, so read the live
      account first. For a percentage cut, multiply every enabled level's capacity on the chosen
      side by one ratio; leave disabled levels alone and never round a live nonzero capacity to zero.
      A fill smaller than the first level is unchanged, so only a large swap shows the change.

      EXAMPLE - keep 10% of sell depth: sell_level_N_amount = floor(live sell_level_N_amount * 1000 / 10000)
      for every enabled sell level; leave the buy side unset.

  - id: tessera-curve
    name: Override Curve
    description: Scale the output factor Tessera applies at each ladder level
    idl_account_name: MarketState
    address:
      type: pubkey
    properties:
      - { path: sell_level_0_factor, offset: 168, encoding: u64, label: "Sell level 1 output factor", description: "Output factor of the first sell level; 1000000 is neutral, lower pays less quote." }
      - { path: sell_level_1_factor, offset: 192, encoding: u64, label: "Sell level 2 output factor", description: "Output factor of this level, 1000000 neutral; must be lower than the previous level's factor." }
      - { path: sell_level_2_factor, offset: 216, encoding: u64, label: "Sell level 3 output factor", description: "Output factor of this level, 1000000 neutral; must be lower than the previous level's factor." }
