protocol: Tessera
version: v1
account_type: MarketState

raw_layout: true

tags:
  - pmm
  - prop-amm
  - swap

constants:
  market:
    label: Tessera market
    description: Choose one of the Tessera markets its maker quoted recently, read from the program's own accounts.
    source:
      program_accounts:
        program: TessVdML9pBGgG9yGks7o4HewRaXVAMuoVj4x83GLQH
        size: 1264
        filters:
          - offset: 96
            bytes: [5, 0, 0, 0, 0, 0, 0, 0]
        fields:
          base_mint: { offset: 24, encoding: pubkey }
          quote_mint: { offset: 56, encoding: pubkey }
          freshness_limit_slots: { offset: 88, encoding: u64 }
          last_update_slot: { offset: 120, encoding: u64 }
        pair: { base: base_mint, quote: quote_mint }
        default:
          base: So11111111111111111111111111111111111111112
          quote: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
        fresh: { field: last_update_slot, within_slots: 5000 }

templates:
  - id: tessera-price
    name: Override Price
    description: Move a Tessera market's reference price in both swap directions
    idl_account_name: MarketState
    address:
      type: pubkey
    properties:
      - path: quote_atoms_per_base_atom_x1e15
        offset: 128
        encoding: u64
        label: Quote per base
        description: >-
          Quote atoms paid per base atom, times 10^15. Prices base-to-quote sells; set it together
          with base_atoms_per_quote_atom_x1e15.
      - path: base_atoms_per_quote_atom_x1e15
        offset: 144
        encoding: u64
        label: Base per quote
        description: >-
          Base atoms paid per quote atom, times 10^15. Prices quote-to-base buys; the integer floor
          of 10^30 divided by quote_atoms_per_base_atom_x1e15.
    llm_context: |
      The target account is chosen through account.pubkey (a market option's value); never put a market key in values.
      PRECONDITION - THE QUOTE MUST BE FRESH. Tessera rejects a quote whose last update is at least
      the market's freshness_limit_slots old with custom error 65535 (0xffff), so a correct price can
      appear to do nothing. Also apply tessera-freshness with last_update_slot 0 in the same slot.

      Set fetchBeforeUse: true so the live account is forked first; false only for a later override
      that builds on state an earlier override in the same scenario prepared.

      Tessera stores one price per direction in raw atoms. Offset 128 alone moves base-to-quote
      sells, offset 144 alone moves quote-to-base buys, so set both as one invariant. Read
      base_decimals and quote_decimals from the selected market's metadata:
        quote_atoms_per_base_atom_x1e15 = price * 10^(quote_decimals - base_decimals) * 10^15
        base_atoms_per_quote_atom_x1e15 = floor(10^30 / quote_atoms_per_base_atom_x1e15)
      Pass both as decimal integer strings.

      For a fill that starts and ends in the first ladder level:
        sell output = floor(base_in * quote_atoms_per_base_atom_x1e15 * sell_level_0_factor / 10^21)
        buy output  = floor(quote_in * base_atoms_per_quote_atom_x1e15 * buy_level_0_factor / 10^21)
      A factor of 1000000 is neutral.

      EXAMPLE - "SOL is worth $100" on SOL / USDC (9/6 decimals):
        quote_atoms_per_base_atom_x1e15: "100000000000000"
        base_atoms_per_quote_atom_x1e15: "10000000000000000"

      EXAMPLE - "BTC is worth $100000" on cbBTC / USDC (8/6 decimals):
        quote_atoms_per_base_atom_x1e15: "1000000000000000000"
        base_atoms_per_quote_atom_x1e15: "1000000000000"

  - id: tessera-freshness
    name: Override Quote Freshness
    description: Keep a Tessera quote current or age it past the market's freshness limit
    idl_account_name: MarketState
    address:
      type: pubkey
    properties:
      - path: last_update_slot
        offset: 120
        encoding:
          slot:
            lead: 0
        label: Last-update offset
        description: >-
          Relative to the slot where the override materializes; 0 means updated now, a negative
          value ages the quote by that many slots.
    llm_context: |
      The target account is chosen through account.pubkey (a market option's value); never put a market key in values.
      This one template covers both a fresh and a stale quote. The stored word is an absolute slot;
      the value is an offset from the slot where the override materializes, clamped at zero.

      Set fetchBeforeUse: true so the live account is forked first; false only for a later override
      that builds on state an earlier override in the same scenario prepared.

      Tessera rejects a quote whose age is at least the market's own limit, read from the selected
      market's freshness_limit_slots metadata. The boundary is exclusive:
      last_update_slot -(freshness_limit_slots - 1) still fills, -freshness_limit_slots rejects
      both swap directions with custom error 65535 (0xffff).

      HOW TO USE:
      1. For a fresh quote set last_update_slot to 0
      2. For a stale quote set it to minus the market's freshness_limit_slots, e.g. -20 on a 20-slot market
      3. A fresh quote lasts freshness_limit_slots; schedule this template again in each later slot
         where a quote is needed, and never after a stale override you want to keep stale

  - id: tessera-depth
    name: Override Depth
    description: Change how much Tessera fills at each level of its sell and buy ladders
    idl_account_name: MarketState
    address:
      type: pubkey
    properties:
