      - { path: buy_level_11_factor, offset: 912, encoding: u64, label: "Buy level 12 output factor", description: "Output factor of this level, 1000000 neutral; must be lower than the previous level's factor." }
      - { path: buy_level_12_factor, offset: 936, encoding: u64, label: "Buy level 13 output factor", description: "Output factor of this level, 1000000 neutral; must be lower than the previous level's factor." }
      - { path: buy_level_13_factor, offset: 960, encoding: u64, label: "Buy level 14 output factor", description: "Output factor of this level, 1000000 neutral; must be lower than the previous level's factor." }
      - { path: buy_level_14_factor, offset: 984, encoding: u64, label: "Buy level 15 output factor", description: "Output factor of this level, 1000000 neutral; must be lower than the previous level's factor." }
      - { path: buy_level_15_factor, offset: 1008, encoding: u64, label: "Buy level 16 output factor", description: "Output factor of this level, 1000000 neutral; must be lower than the previous level's factor." }
      - { path: buy_level_16_factor, offset: 1032, encoding: u64, label: "Buy level 17 output factor", description: "Output factor of this level, 1000000 neutral; must be lower than the previous level's factor." }
      - { path: buy_level_17_factor, offset: 1056, encoding: u64, label: "Buy level 18 output factor", description: "Output factor of this level, 1000000 neutral; must be lower than the previous level's factor." }
      - { path: buy_level_18_factor, offset: 1080, encoding: u64, label: "Buy level 19 output factor", description: "Output factor of this level, 1000000 neutral; must be lower than the previous level's factor." }
      - { path: buy_level_19_factor, offset: 1104, encoding: u64, label: "Buy level 20 output factor", description: "Output factor of this level, 1000000 neutral; must be lower than the previous level's factor." }
    llm_context: |
      The target account is chosen through account.pubkey (a market option's value); never put a market key in values.
      PRECONDITION - THE QUOTE MUST BE FRESH. Apply tessera-freshness with last_update_slot 0,
      otherwise the swap rejects with custom error 65535 and the new curve is never used.

      Set fetchBeforeUse: true so the live account is forked first; false only for a later override
      that builds on state an earlier override in the same scenario prepared.

      The factor multiplies the directional price: output = input * price * factor / 10^21, so a
      factor of 1000000 is neutral and 990000 pays 1% less. The sell factors price base-to-quote
      sells, the buy factors quote-to-base buys; the other side is untouched.

      Factors must strictly descend across a ladder. A level whose factor is equal to or larger than
      the one before it makes the program reject with custom error 8. To widen a side, read all
      twenty live factors and multiply every nonzero one by the same ratio, which preserves the
      ordering. A ratio that rounds a nonzero factor to zero disables that level.

      EXAMPLE - make selling base 50% worse: sell_level_N_factor = floor(live * 5000 / 10000) for
      all twenty sell levels.

  - id: tessera-halt
    name: Halt Liquidity
    description: Disable every level of a Tessera ladder; each field is one swap direction
    idl_account_name: MarketState
    address:
      type: pubkey
    properties:
      - path: sell_levels_enabled
        offset: 176
        encoding:
          u8_strided:
            count: 20
            stride: 24
        label: Sell liquidity enabled
        description: Enabled flag of all twenty sell levels; only 0 is supported.
      - path: buy_levels_enabled
        offset: 656
        encoding:
          u8_strided:
            count: 20
            stride: 24
        label: Buy liquidity enabled
        description: Enabled flag of all twenty buy levels; only 0 is supported.
    llm_context: |
      The target account is chosen through account.pubkey (a market option's value); never put a market key in values.
      Set fetchBeforeUse: true so the live account is forked first; false only for a later override
      that builds on state an earlier override in the same scenario prepared.

      Each field halts one direction; set one to 0 for a one-sided halt, both for a full halt. Each writes the enabled flag of all twenty levels on its side,
      after which the program rejects either swap direction with custom error 65535 (0xffff), the
      same code as a stale quote. Clearing only the first level does not halt a quote that the
      market starts at a later level. Writing 1 would enable levels whose capacity and factor were
      never configured, so only 0 is supported.
