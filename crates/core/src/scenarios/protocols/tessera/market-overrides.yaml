      - { path: buy_level_7_factor, offset: 816, encoding: u64, label: "Buy level 8 output factor", description: "Output factor of this level, 1000000 neutral; must be lower than the previous level's factor." }
      - { path: buy_level_8_factor, offset: 840, encoding: u64, label: "Buy level 9 output factor", description: "Output factor of this level, 1000000 neutral; must be lower than the previous level's factor." }
