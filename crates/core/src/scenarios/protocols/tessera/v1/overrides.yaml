  - id: tessera-fair-value
    name: Override Tessera Fair Value
    description: Move a Tessera market's reference price atomically in both directions
    idl_account_name: MarketState
    address:
      type: pubkey
      value: FLckHLGMJy5gEoXWwcE68Nprde1D4araK4TGLw4pQq2n
    properties:
      - path: quote_atoms_per_base_atom_x1e15
        offset: 128
        encoding: u64
        label: Quote per base
        description: "Quote atomic units per base atomic unit multiplied by 10^15. Use the builder to derive this from mint decimals."
      - path: base_atoms_per_quote_atom_x1e15
        offset: 144
        encoding: u64
        label: Base per quote
        description: "Base atomic units per quote atomic unit multiplied by 10^15. Use the builder to derive the reciprocal atomically."
    llm_context: |
      Discover markets with list_tessera_markets and set the override account to the chosen address.
      SET BOTH FIELDS AS ONE INVARIANT. Their product is approximately 10^30, with integer-floor
      rounding in the reciprocal field. Changing only offset 128 moves base-to-quote sells but
      leaves quote-to-base buys unchanged; changing only offset 144 does the opposite.

      Use the Tessera fair-value builder when starting from a human price. It calculates both exact
      integer fields from the selected market's mint decimals and rejects zero or overflow. If
      composing the raw template directly, use decimal integer strings rather than JSON numbers.

      Tessera rejects a quote once it reaches the market's freshness limit, with program error
      0xffff. Pair long-running scenarios with tessera-freshness.

      EXAMPLE - WSOL/USDC at 100 quote tokens per base token:
      quote_atoms_per_base_atom_x1e15: "100000000000000"
      base_atoms_per_quote_atom_x1e15: "10000000000000000"

