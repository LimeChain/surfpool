  - id: tessera-halt
    name: Halt Tessera Liquidity
    description: Disable the first required level on both directional ladders
    idl_account_name: MarketState
    address:
      type: pubkey
      value: FLckHLGMJy5gEoXWwcE68Nprde1D4araK4TGLw4pQq2n
    properties:
      - path: sell_level_0_enabled
        offset: 176
        encoding: u8
        label: Sell liquidity enabled
        description: Set to zero to make base-to-quote quotes fail deterministically.
      - path: buy_level_0_enabled
        offset: 656
        encoding: u8
        label: Buy liquidity enabled
        description: Set to zero to make quote-to-base quotes fail deterministically.
    llm_context: |
      SET BOTH FIELDS TO ZERO AS ONE INVARIANT. The current deployed program rejects either quote
      direction with custom error 0xffff when its required first level is disabled. Use this as a
      deterministic liquidity-outage scenario, not as a depth or price scenario. Do not persist it.

  - id: tessera-stale-quote
    name: Make Tessera Quote Stale
    description: Age a Tessera quote to its market's rejection boundary
    idl_account_name: MarketState
    address:
      type: pubkey
      value: FLckHLGMJy5gEoXWwcE68Nprde1D4araK4TGLw4pQq2n
    properties:
      - path: last_update_slot
        offset: 120
        encoding:
          slot:
            lead: -20
        label: Slot lead
        description: >-
          How far behind the materialization slot to place the quote, as a negative integer.
          Pass null to use -20, the limit of most markets and of the default one.
    llm_context: |
      The value you pass IS the lead: Surfpool writes the materialization slot plus it, clamped at
      zero. Pass null to take the -20 default. This is one template for every market, not one per
      limit.

      Rejection is at age greater than or equal to the market's own limit, so the lead must be at
      most minus that limit. Read freshness_limit_slots for the chosen address in the market
      constant and negate it; offset 88 on the live account is the same number. As of the catalog's
      capture date fourteen markets are at 20, eleven at 25 and one at 55, but pass whatever the
      catalog says rather than assuming one of those three.

      At the boundary the current deployed program rejects the swap with custom error 65535, while
      one slot younger succeeds. Do not persist this override: the quote should stay stale.

      Set fetchBeforeUse: true so the live market is forked first. Keep override labels short
      ("SOL/USDC stale quote").

  - id: tessera-freshness
    name: Refresh Tessera Quote
    description: Publish the materialization slot into Tessera's freshness field
    idl_account_name: MarketState
    address:
      type: pubkey
      value: FLckHLGMJy5gEoXWwcE68Nprde1D4araK4TGLw4pQq2n
    properties:
      - path: last_update_slot
        offset: 120
        encoding:
          slot:
            lead: 0
        label: Current materialization slot
        description: Slot lead, as an integer. Pass null to take the lead of zero and write the materialization slot itself.
    llm_context: |
      Tessera accepts a quote up to 19 slots old. At age 20 the current deployed program rejects the
      swap with custom error 0xffff. This differs from BisonFi, which can silently return zero.

      Pass null for last_update_slot to take this template's lead of zero, which writes the exact
      materialization slot. A number would be read as the lead instead, so passing 0 happens to mean
      the same thing here and -5 would quietly age the quote by five slots.

      Use persist: true when the prepared state must remain executable beyond the market's freshness
      window; each application then writes its own slot rather than repeating the first one.
