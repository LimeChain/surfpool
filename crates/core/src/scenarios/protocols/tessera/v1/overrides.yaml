    llm_context: |
      Discover markets with list_tessera_markets and set the override account to the chosen address.
      For percentage reductions, use create_tessera_depth_scenario, which reads the current Surfnet
      account and scales enabled levels exactly. Pass remaining basis points: 1000 keeps 10%,
      10000 leaves a direction unchanged. It also adds persistent freshness.
      These are directional capacities, not token vault balances. Do not assume they
      are monotonic cumulative breakpoints. To make one direction shallower, scale the currently
      enabled amount fields for that direction by the same ratio. Lower sell_levels for a large
      base-to-quote sell and buy_levels for a large quote-to-base buy. The opposite ladder is
      behaviorally inactive for that direction.

      Small trades may not reveal a depth change. The live-fork proof uses large trades and shows
      that dividing all active-side capacities by ten worsens the fill, while changing the
      inactive-side capacities leaves it unchanged.

      Do not invent missing levels or enable disabled levels. Fetch the live account first and copy
      all twenty current values before applying a uniform ratio only to enabled levels. A ratio that
      rounds a live nonzero capacity down to zero leaves the level flagged enabled with nothing
      behind it, which is not a state the market produces on its own; raise the ratio instead.

