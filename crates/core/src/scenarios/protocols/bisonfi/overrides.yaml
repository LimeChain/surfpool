protocol: BisonFi
# The pool-account version this layout describes, and the only one supported. BisonFi ships no
# program semver; the guard below rejects the one remaining version-2 account outright.
version: v3
account_type: PoolStat

# BisonFi publishes no IDL and none is reconstructed here. Writes go through the byte layout below.
raw_layout:
  account_size: 2048
  magic:
    offset: 0
    # "POOLSTAT" followed by the u64 version, which must be 3.
    #
    # The version is part of the guard on purpose: size and magic alone admit an older account whose
    # fields sit elsewhere, and a scenario naming it would write a price into an unrelated field.
    bytes: [80, 79, 79, 76, 83, 84, 65, 84, 3, 0, 0, 0, 0, 0, 0, 0]

tags:
  - pmm
  - prop-amm
  - swap

templates:
  - id: bisonfi-fair-value
    name: Override BisonFi Fair Value
    description: Override the mid price BisonFi quotes around
    idl_account_name: PoolStat
    address:
      type: pubkey
      value: 8FnX3xo2yYw3EUE6w3nQA4GfXGS9wpK6oj3veJpbFzLo
    properties:
      - path: fair_value
        offset: 832
        encoding: u128
        label: Fair value
        description: >-
          Mid price as a fixed-point integer scaled by 2^88. Pass it as a decimal string.
          Example: $75.45 is "23350643991020486314894032896"
    llm_context: |
      PRECONDITION - THE QUOTE MUST BE FRESH. If the venue's quote is two or more slots stale this
      override is silently ignored: the swap returns zero and the transaction still SUCCEEDS, with
      your value sitting correctly in the account. A forked pool goes stale on its own after two
      slots, because nothing in a fork republishes the mid. If your scenario spends more than a slot
      before executing, refresh last_update_slot with bisonfi-freshness first.

      This is the only price lever. The reserves control depth, not price: BisonFi quotes around a mid
      the operator publishes, so changing vault balances will not move the quote.

      HOW TO USE:
      1. Multiply the price by 2^88 (309485009821345068724781056)
      2. Pass the result as a decimal STRING, since it exceeds what a JSON number holds exactly
      3. Set fetchBeforeUse: true so the live pool is forked first

      The default address is the live WSOL/USDC market. Other markets are found by reading base_mint
      and quote_mint on the accounts the program owns.

      MID-FLIGHT VARIANT: schedule two steps on this field a couple of slots apart, and a caller
      prices on one mid and executes against another. A reprice is caught by the caller's own
      minimum-output bound, so the transaction reverts rather than filling at the worse price.

      CROSS-VENUE ARBITRAGE: moving this away from an AMM's price on the same pair creates an
      executable arbitrage, with both legs in one transaction. Two practical notes: use an
      exact-OUTPUT swap on the AMM leg, because instruction amounts are fixed when the transaction is
      built and the second leg needs a known size; and expect the undislocated round trip to LOSE
      money, since the taker pays a fee on both venues. A control run showing a profit at the true mid
      is measuring something other than a round trip.

      EXAMPLE - "SOL is worth $50":
      fair_value: "15474250491067253436239052800"
  - id: bisonfi-depth
    name: Override BisonFi Depth
    description: Make BisonFi shallower so large trades move its price
    idl_account_name: PoolStat
    address:
      type: pubkey
      value: 8FnX3xo2yYw3EUE6w3nQA4GfXGS9wpK6oj3veJpbFzLo
    properties:
      - path: base_reserve
        offset: 48
        encoding: u64
        label: Base reserve
        description: >-
          Base tokens the pool can pay out, in the mint's smallest unit. Constrains a BUY of the base
          token. Example: 204479526927
      - path: quote_reserve
        offset: 56
        encoding: u64
        label: Quote reserve
        description: >-
          Quote tokens the pool can pay out, in the mint's smallest unit. Constrains a SELL of the base
          token. Example: 22008930770
    llm_context: |
      PRECONDITION - THE QUOTE MUST BE FRESH. If the venue's quote is two or more slots stale this
      override is silently ignored: the swap returns zero and the transaction still SUCCEEDS, with
      your value sitting correctly in the account. A forked pool goes stale on its own after two
      slots, because nothing in a fork republishes the mid. If your scenario spends more than a slot
      before executing, refresh last_update_slot with bisonfi-freshness first.

      The depth lever: how far a trade moves the price. For how wide the venue quotes around its mid,
      use bisonfi-spread instead.

      WHICH FIELD TO SET: the pool pays out of one side, and that side's reserve constrains the trade.
      To make SELLING the base token expensive, lower quote_reserve. To make BUYING it expensive,
      lower base_reserve. Set both if the scenario does not fix a direction.

      REACH FOR AN ORDER OF MAGNITUDE. The response is not linear: a trade worth a couple of percent
      of a reserve barely notices that reserve being quartered. A large reduction produces slippage; a
      very large one produces an outright "insufficient liquidity" refusal, which is useful in itself
      for testing how a router handles a venue that cannot fill.

      LOWER, DO NOT RAISE. These fields mirror the balances of the token accounts named by base_vault
      and quote_vault, which this template does not touch. Lowering is safe: the pool quotes and pays
      out less than it really holds. Raising one above the vault's real balance makes the program
      compute a payout the vault cannot cover, and the swap fails when it settles.

      The two directions are largely but not perfectly independent. Treat them as independent for
      slippage-scale testing; do not assert that one is untouched to the byte.

      EXAMPLE - "BisonFi is thin, selling SOL into it slips badly":
      quote_reserve: 1100446538524
  - id: bisonfi-spread
    name: Override BisonFi Spread
    description: Widen or tighten the spread BisonFi quotes around its mid
    idl_account_name: PoolStat
    address:
      type: pubkey
      value: 8FnX3xo2yYw3EUE6w3nQA4GfXGS9wpK6oj3veJpbFzLo
    properties:
      - path: working_levels.0.tick_offset
        offset: 300
        encoding:
          i32_strided:
            count: 4
            stride: 16
        label: Bid spread, working book
        description: >-
          Sell-side offset, outer levels excluded. Units of 1/2,560,000 of the mid, NEGATIVE. -25600 is 1% below mid.
      - path: working_levels.4.tick_offset
        offset: 364
        encoding:
          i32_strided:
            count: 4
            stride: 16
        label: Ask spread, working book
        description: >-
          Buy-side offset, outer levels excluded. POSITIVE. 25600 is 1% above mid.
      - path: configured_levels.0.tick_offset
        offset: 540
        encoding:
          i32_strided:
            count: 4
            stride: 16
        label: Bid spread, source book
        description: >-
          Companion bid run. Set it to the same value as the working bid spread.
      - path: configured_levels.4.tick_offset
        offset: 604
        encoding:
          i32_strided:
            count: 4
            stride: 16
        label: Ask spread, source book
        description: >-
          Companion ask run. Set it to the same value as the working ask spread.
      - path: continuation_levels.0.tick_offset
        offset: 1048
        encoding:
          i32_strided:
            count: 5
            stride: 16
        label: Bid spread, working outer book
        description: >-
          Sell-side offset for the outer levels. NEGATIVE.
      - path: continuation_levels.5.tick_offset
        offset: 1128
        encoding:
          i32_strided:
            count: 5
            stride: 16
        label: Ask spread, working outer book
        description: >-
          Buy-side offset for the outer levels. POSITIVE.
      - path: continuation_source_levels.0.tick_offset
        offset: 1208
        encoding:
          i32_strided:
            count: 5
            stride: 16
        label: Bid spread, source outer book
        description: >-
          Companion outer bid run. Same value as the working outer bid spread.
      - path: continuation_source_levels.5.tick_offset
        offset: 1288
        encoding:
          i32_strided:
            count: 5
            stride: 16
        label: Ask spread, source outer book
        description: >-
          Companion outer ask run. Same value as the working outer ask spread.
    llm_context: |
      PRECONDITION - THE QUOTE MUST BE FRESH. If the venue's quote is two or more slots stale this
      override is silently ignored: the swap returns zero and the transaction still SUCCEEDS, with
      your value sitting correctly in the account. A forked pool goes stale on its own after two
      slots, because nothing in a fork republishes the mid. If your scenario spends more than a slot
      before executing, refresh last_update_slot with bisonfi-freshness first.

      The spread lever: how wide the venue quotes around its mid, independently of how much inventory
      it holds. Use bisonfi-depth to make a venue THIN and this one to make it EXPENSIVE.

      THE UNIT IS 1/2,560,000 OF THE MID. So 25600 is 1%, 2560 is 10 bps and 256 is 100 ppm. To
      convert a target spread: ticks = percent * 25600.

      SET ALL FOUR BID PROPERTIES TO THE SAME VALUE, or all four ask properties, or all eight. Each
      property writes one run of the book and they have to agree; setting only some of them produces a
      spread that varies with timing.

      SIGNS MATTER. Bid offsets are negative and price SELLS of the base token. Ask offsets are
      positive and price BUYS.

      DO NOT SET A TICK TO ZERO to mean "no offset" - use a small magnitude instead.

      TRADE SIZE MATTERS. Very small trades do not consult the ladder at all, and very large ones stop
      paying the full spread. Size a test trade at a percent or so of the pool's base_reserve, and try
      a few sizes before concluding the lever did nothing.

      EXAMPLE - "BisonFi is quoting 1% wide on the sell side":
      working_levels.0.tick_offset: -25600
      configured_levels.0.tick_offset: -25600
      continuation_levels.0.tick_offset: -25600
      continuation_source_levels.0.tick_offset: -25600
  - id: bisonfi-freshness
    name: Override BisonFi Quote Freshness
    description: Keep BisonFi's published quote live
    idl_account_name: PoolStat
    address:
      type: pubkey
      value: 8FnX3xo2yYw3EUE6w3nQA4GfXGS9wpK6oj3veJpbFzLo
    properties:
      - path: last_update_slot
        offset: 72
        encoding: u64
        label: Last update slot
        description: "Slot of the most recent mid publication. Example: 439868588"
    llm_context: |
      This field is the venue's liveness signal.

      A FORKED POOL GOES STALE BY ITSELF. Surfpool takes its starting slot from mainnet and never
      re-fetches an account it has already pulled, so nothing republishes the mid. Two slots after the
      fork the venue stops quoting and stays that way, and from then on the price, depth and spread
      overrides are silently ignored - the swap returns zero and the transaction still SUCCEEDS. That
      makes this template the precondition for the other three: if your scenario spends more than a
      slot before executing, refresh this field first.

      HOW TO USE THIS TEMPLATE:
      1. Set last_update_slot to the current slot. The venue resumes quoting the price it already
         held - a fresh timestamp is enough, no new price is needed
      2. Set persist: true, or the next slot's state overwrites your value

      A scenario that executes within a slot of forking does not need this. One that spends longer on
      setup does.

      EXAMPLE - "keep the maker quoting at chain slot 439868588":
      last_update_slot: 439868588
