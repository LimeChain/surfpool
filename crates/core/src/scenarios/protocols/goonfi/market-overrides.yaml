protocol: GoonFi
version: v2
account_type: MarketState

raw_layout: true

tags:
  - pmm
  - prop-amm
  - swap

templates:
  - id: goonfi-reference-band
    name: Override Reference Band
    description: Move the market's reference prices that bound the oracle quote
    idl_account_name: MarketState
    address:
      type: pubkey
    properties:
      - path: reference_price_a_x1e6
        offset: 1712
        encoding: u64
        label: Reference price A
        description: First reference anchor, quote per base times 10^6, independent of mint decimals.
      - path: reference_price_b_x1e6
        offset: 1720
        encoding: u64
        label: Reference price B
        description: Second reference anchor, quote per base times 10^6; their order is not fixed.
    llm_context: |
      FINDING THE MARKET WHEN THE USER NAMES A PAIR OR STUDIO DOES NOT LIST IT:
      1. Resolve both token symbols with get_token_address, both calls at once.
      2. Make two getProgramAccounts calls at once, each with two positional params: the program id
         string "goonuddtQRrWqqn5nFyczVKaie28f3kDkHWkHtURSLE", then the config object
         {"encoding":"base58","dataSlice":{"offset":208,"length":32},"filters":[
         {"memcmp":{"offset":0,"bytes":"99nuWqpQZwP"}},{"memcmp":{"offset":80,"bytes":"<base mint>"}},
         {"memcmp":{"offset":112,"bytes":"<quote mint>"}}]}.
         The second call uses dataSlice {"offset":144,"length":32}. Offset 0 is the market tag.
         Each result's pubkey is a market for the pair; its data is the market's oracle in the
         first call and its base vault in the second.
      3. No result usually means a mistyped mint. Copy both mints again exactly from
         get_token_address and repeat once before saying GoonFi has no market for the pair.
      4. A single result is the market. Several results mean the pair also has stopped markets:
         call getMultipleAccounts with encoding "jsonParsed" on their base vaults and keep the
         market whose vault holds the most tokens. If every vault is empty, say so instead of
         guessing.
      5. Put the market in the override's account as {"pubkey":"<market>"} and set
         fetchBeforeUse: true. A market address the user gives is used as is. The market address
         is never an override value.

      PRECONDITION - MOVE THE BAND WITH THE PRICE. GoonFi checks the oracle quote against these two
      reference prices before it fills. A sell whose oracle bid sits above the band, or a buy whose
      oracle ask sits below it, rejects with custom error 0x24 (36). Every goonfi-price move needs
      this template on the same market, scaled by the same factor, in the same scenario.

      UNIT: quote per base times 10^6, the same scale as the oracle and independent of mint
      decimals. SOL at 99.74 USDC is 99740000.

      CONVERSION:
        reference_price_x1e6 = human_price * 10^6

      Set both anchors. Their order on the live market is not fixed, so set both to the target price
      or scale both by the same factor as the oracle.

      Set fetchBeforeUse: true to pull the account from upstream first; false only for a later override
      that builds on state an earlier override in the same scenario prepared. The market's oracle is
      at market bytes 208..240; its vaults are at 144..176 (base) and 176..208 (quote).

      ONE-SIDED BLOCK: leaving the band untouched while raising only the bid blocks sells, and
      lowering only the ask blocks buys. The other direction keeps filling.

      EXAMPLE - "SOL is worth $150" on the selected SOL/USDC market, paired with goonfi-price:
        reference_price_a_x1e6: 150000000
        reference_price_b_x1e6: 150000000
