protocol: SPL Token
version: v1
account_type: TokenAccount
idl_file_path: idl.json

tags:
  - token
  - vault
  - balance

constants:
  pump_token_mint:
    label: Pump Token
    description: Select a pump.fun token or enter a validated Token-2022 mint
    source: verified_tokens
    address_suffix: pump

templates:
  - id: spl-token-account-balance
    name: Override Token Account Balance
    description: |
      Override the balance of any SPL token account.
      Use this to simulate price changes in AMM pools by modifying vault balances.
      For AMM v4 price simulation: price = pc_vault_balance / coin_vault_balance
    idl_account_name: TokenAccount
    properties: ["amount"]
    llm_context: |
      Use this template to override token vault balances for price simulation.

      For Raydium AMM v4 price changes:
      1. Find the pool's token_coin and token_pc vault addresses from the AmmInfo
      2. Override both vault balances to set desired price ratio

      Example: To simulate SOL at $200 in a SOL/USDC pool:
      - If coin vault (SOL) has 1000 SOL
      - Set pc vault (USDC) to 200,000 USDC
      - Price = 200,000 / 1000 = $200 per SOL

      The amount field is in the token's smallest unit (lamports for SOL, micro-units for USDC with 6 decimals).
    address:
      type: pubkey

  - id: spl-token-mint-supply
    name: Override Token Mint Supply
    description: Override the total supply of an SPL token mint
    idl_account_name: Mint
    properties: ["supply"]
    address:
      type: pubkey

  - id: pump-token-2022-curve-balance
    name: Override Pump Token-2022 Curve Balance
    description: Override the Token-2022 base-token vault belonging to a pump.fun bonding curve.
    idl_account_name: TokenAccount
    properties:
      - path: amount
        label: Curve Vault Amount
        description: Base tokens held by the curve, including the reserve retained for migration
      - path: token_mint
        type: constant_ref
        label: Pump Token Mint
        constant: pump_token_mint
    llm_context: |
      Use this together with pump-bonding-curve-custom when preparing a Token-2022
      pump.fun coin near graduation. The amount must equal the new real_token_reserves
      plus the coin's existing migration reserve. Never set it to real_token_reserves alone.
    address:
      type: pda
      program_id: ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJA8knL
      seeds:
        - type: derived_pda
          program_id: 6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P
          seeds:
            - type: string
              value: bonding-curve
            - type: property_ref
              value: token_mint
        - type: pubkey
          value: TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb
        - type: property_ref
          value: token_mint
