name: Scenarios monitoring

# Checks the protocols the scenarios integrate against what is live on mainnet: the IDL each
# program publishes, and the integration tests. The report is the run's summary. Nothing is
# committed: the report and the state the next run compares against are the run's artifact.
# SURFPOOL_TEST_RPC_URL is optional and used by the tests alone; the public endpoint rate-limits
# them.
on:
  push:
  workflow_dispatch:

# Each run compares against the one before it, so they run one at a time.
concurrency:
  group: scenarios-monitoring
  cancel-in-progress: false

permissions:
  contents: read
  # Reads the previous run's artifact.
  actions: read

env:
  ARTIFACT: scenarios-monitoring

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4

      - name: Read the previous state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous
          # GitHub lists artifacts newest first. This run's own is skipped, so a re-run compares
          # against the same state its first attempt did.
          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$ARTIFACT&per_page=20")
          run=$(jq -r --argjson self "$GITHUB_RUN_ID" \
            '[.artifacts[] | select(.expired | not) | .workflow_run.id | select(. != $self)][0] // empty' \
            <<< "$artifacts")
          if [ -n "$run" ]; then
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT" --dir previous
            echo "Comparing with run $run."
          else
            echo "No earlier run's state: this run records the baseline."
          fi

      - name: Install build dependencies
        # Only the tests need these, so a failure here must not cost the run its IDL report.
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y libudev-dev clang libclang-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build the monitor
        run: cargo build -p surfpool-scenarios-monitor

      - name: Integration tests
        # The tests add to the report and never stop it: whether they fail, do not build or hang,
        # the check step still runs and reports the IDLs next to whatever the log holds.
        continue-on-error: true
        timeout-minutes: 60
        env:
          SURFPOOL_TEST_RPC_URL: ${{ secrets.SURFPOOL_TEST_RPC_URL }}
        run: |
          # An unset secret arrives as an empty string, which the tests would take for their
          # endpoint; unset, they use the public one.
          [ -n "$SURFPOOL_TEST_RPC_URL" ] || unset SURFPOOL_TEST_RPC_URL
          # Every protocol's tests live under tests::protocols; without the filter the whole
          # crate's tests would run. The check step reads the outcome from the log, so a failing
          # test never fails this step.
          cargo test -p surfpool-core --lib --features integration-tests --no-fail-fast \
            -- tests::protocols:: > tests.log 2>&1 || true
          grep -E '^test result:|^test .* FAILED$' tests.log || tail -n 40 tests.log

      - name: Check
        env:
          # Makes no request here; it is passed so its key can be kept out of the published
          # test output.
          SURFPOOL_TEST_RPC_URL: ${{ secrets.SURFPOOL_TEST_RPC_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          target/debug/scenarios-monitor --stamp "$(date -u +%Y-%m-%dT%H-%M-%SZ)" \
            --previous previous --out out --tests-log tests.log --run-url "$RUN_URL"
          cat out/report/report.md >> "$GITHUB_STEP_SUMMARY"

      # Holds report/ for readers and state/ for the next run, which is why it is kept this long.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: out
          if-no-files-found: error
          retention-days: 90
          # A re-run replaces its first attempt's artifact.
          overwrite: true

      # Anything short of clean fails the run: a protocol needs attention, the tests did not
      # finish, or an IDL could not be fetched.
      - name: Fail unless every check is clean
        run: |
          verdict=$(cat out/verdict)
          echo "verdict: $verdict"
          [ "$verdict" = clean ]
