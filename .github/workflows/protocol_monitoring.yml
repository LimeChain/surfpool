name: Protocol monitoring

# Twice a day, checks whether shipped state preparation still matches deployment and commits
# the result to a branch. SURFPOOL_TEST_RPC_URL is optional; without it, suites report unverified.
on:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:

concurrency:
  group: protocol-monitoring
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    name: Monitor
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CARGO_TERM_COLOR: never
      REPORT_BRANCH: scenarios/monitoring
    steps:
      # Only the publish step needs a token, and it brings its own.
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Stamp the run
        id: stamp
        run: echo "at=$(date -u +%Y-%m-%dT%H-%MZ)" >> "$GITHUB_OUTPUT"
      - name: Restore snapshot
        id: snapshot
        uses: actions/cache/restore@v4
        with: { path: snapshot, key: "monitoring-snapshot-${{ github.run_id }}", restore-keys: monitoring-snapshot- }
      # Secret scoped to this step only: nothing not in the environment can leak it.
      - name: Drift checks
        id: checks
        env:
          SURFPOOL_TEST_RPC_URL: ${{ secrets.SURFPOOL_TEST_RPC_URL }}
        run: |
          set +e
          node .github/scripts/monitoring/monitor.mjs check --snapshot snapshot --out out
          if [ -d out/snapshot.next ]; then echo "snapshot=true" >> "$GITHUB_OUTPUT"; fi
          exit 0
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: monitoring-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: monitoring-${{ runner.os }}-
      - name: Integration suites
        id: suites
        env:
          SURFPOOL_TEST_RPC_URL: ${{ secrets.SURFPOOL_TEST_RPC_URL }}
        run: |
          set +e
          timeout 40m cargo test -p surfpool-core --features "integration-tests,ignore_tests_ci" \
            --no-fail-fast -- --test-threads=1 2>&1 | tee tests.log
          exit 0
      - name: Render the report
        if: always()
        run: |
          mkdir -p rendered
          node .github/scripts/monitoring/monitor.mjs render \
            --findings out/findings.json --tests tests.log \
            --out rendered/report.md --status-out rendered/status \
            --timestamp "${{ steps.stamp.outputs.at }}" \
            --commit "${GITHUB_SHA}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Publish the report
        if: always()
        # Through the environment, never interpolated into the script.
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          dir="scenarios/monitoring/reports/${{ steps.stamp.outputs.at }}"
          work=$(mktemp -d)
          git -C "$work" init -q
          git -C "$work" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -C "$work" config http.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -C "$work" config user.name "surfpool-monitoring"
          git -C "$work" config user.email "noreply@github.com"
          # The branch holds reports and nothing else, so it starts as an orphan.
          if git -C "$work" fetch -q --depth 1 origin "$REPORT_BRANCH" 2>/dev/null; then
            git -C "$work" checkout -q -b "$REPORT_BRANCH" FETCH_HEAD
          else
            git -C "$work" checkout -q --orphan "$REPORT_BRANCH"
          fi
          mkdir -p "$work/$dir"
          cp rendered/report.md "$work/$dir/"
          if [ -d out/idls ] && [ -n "$(ls -A out/idls 2>/dev/null)" ]; then
            mkdir -p "$work/$dir/idls"
            cp -r out/idls/. "$work/$dir/idls/"
          fi
          git -C "$work" add -A "$dir"
          if git -C "$work" commit -q -m "monitoring: report ${{ steps.stamp.outputs.at }}"; then
            git -C "$work" push -q origin "HEAD:$REPORT_BRANCH"
            echo "published $dir"
          else
            echo "nothing new to publish for $dir"
          fi
      # Never saved when the checker produced nothing, or the next run reports everything as first.
      - name: Prepare snapshot for saving
        if: always() && steps.checks.outputs.snapshot == 'true'
        run: rm -rf snapshot && mv out/snapshot.next snapshot
      - name: Save snapshot
        if: always() && steps.checks.outputs.snapshot == 'true'
        uses: actions/cache/save@v4
        with: { path: snapshot, key: "monitoring-snapshot-${{ github.run_id }}" }
      - name: Summarise
        if: always()
        run: cat rendered/report.md >> "$GITHUB_STEP_SUMMARY" || true
      # Last, so a red run still leaves its report published before this step fails it.
      - name: Fail when a protocol drifted
        if: always()
        run: |
          status=$(cat rendered/status 2>/dev/null || echo incomplete)
          echo "verdict: $status"
          case "$status" in
            clean|unverified) exit 0 ;;
            *) echo "::error::a monitored protocol no longer matches what we ship ($status); see the report"; exit 1 ;;
          esac
