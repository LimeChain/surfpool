name: Protocol monitoring

# Twice a day, checks whether the protocols we integrate still look the way our templates assume
# and commits the report to a branch. SURFPOOL_TEST_RPC_URL is optional; the public endpoint is
# slow enough that some suites time out against it.
on:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:

concurrency:
  group: protocol-monitoring
  cancel-in-progress: false

env:
  REPORT_BRANCH: scenarios/monitoring

jobs:
  monitor:
    name: Monitor
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # Third-party actions run here, so this job's token stays read-only; publishing has its own job.
    permissions:
      contents: read
    outputs:
      at: ${{ steps.stamp.outputs.at }}
      suites_exit: ${{ steps.suites.outputs.exit }}
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Stamp the run
        id: stamp
        run: echo "at=$(date -u +%Y-%m-%dT%H-%MZ)" >> "$GITHUB_OUTPUT"
      - name: Restore snapshot
        uses: actions/cache/restore@v4
        with:
          path: snapshot
          key: monitoring-snapshot-${{ github.run_id }}
          restore-keys: monitoring-snapshot-
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: monitoring-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: monitoring-${{ runner.os }}-
      # Runs before the drift checks so the report can include this run's test log.
      - name: Integration suites
        id: suites
        env:
          SURFPOOL_TEST_RPC_URL: ${{ secrets.SURFPOOL_TEST_RPC_URL }}
        run: |
          set +e
          timeout 40m cargo nextest run -p surfpool-core --test-threads 1 \
            --features "integration-tests,ignore_tests_ci" --no-fail-fast 2>&1 | tee tests.log
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - run: npm install -g @coral-xyz/anchor-cli@0.31.1
      - name: Drift checks
        env:
          SURFPOOL_TEST_RPC_URL: ${{ secrets.SURFPOOL_TEST_RPC_URL }}
        run: bash .github/scripts/monitor.sh snapshot out
      - if: always()
        run: cat out/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report
          path: out
          if-no-files-found: warn
      # Only when the checker produced a snapshot, or the next run would see an empty cache.
      - name: Replace the snapshot
        id: snapshot
        if: always() && hashFiles('out/snapshot/**') != ''
        run: rm -rf snapshot && mv out/snapshot snapshot
      - if: always() && steps.snapshot.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: snapshot
          key: monitoring-snapshot-${{ github.run_id }}

  publish:
    name: Publish
    needs: monitor
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: report
          path: out
      - name: Publish the report
        # Through the environment, never interpolated into the script.
        env:
          GH_TOKEN: ${{ github.token }}
          AT: ${{ needs.monitor.outputs.at }}
        run: |
          dir="scenarios/monitoring/reports/${AT:-$(date -u +%Y-%m-%dT%H-%MZ)}"
          if [ ! -f out/report.md ]; then
            mkdir -p out
            echo "# Protocol monitoring — no report; the checks did not finish, see the run log." \
              > out/report.md
            echo incomplete > out/status
          fi
          work=$(mktemp -d)
          git -C "$work" init -q
          git -C "$work" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -C "$work" config http.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -C "$work" config user.name "surfpool-monitoring"
          git -C "$work" config user.email "noreply@github.com"
          # The branch holds reports and nothing else, so it starts as an orphan.
          if git -C "$work" fetch -q --depth 1 origin "$REPORT_BRANCH" 2>/dev/null; then
            git -C "$work" checkout -q -b "$REPORT_BRANCH" FETCH_HEAD
          else
            git -C "$work" checkout -q --orphan "$REPORT_BRANCH"
          fi
          mkdir -p "$work/$dir"
          cp out/report.md "$work/$dir/"
          if [ -d out/idls ]; then cp -r out/idls "$work/$dir/idls"; fi
          git -C "$work" add -A "$dir"
          if git -C "$work" commit -q -m "monitoring: report ${dir##*/}"; then
            git -C "$work" push -q origin "HEAD:$REPORT_BRANCH"
            echo "published $dir"
          else
            echo "nothing new to publish for $dir"
          fi
      # Last, so a red run still leaves its report published before this step fails it.
      - name: Fail when a protocol drifted or a suite failed
        env:
          SUITES_EXIT: ${{ needs.monitor.outputs.suites_exit }}
        run: |
          status=$(cat out/status 2>/dev/null || echo incomplete)
          echo "verdict: $status"
          echo "suites exit: ${SUITES_EXIT:-unknown}"
          if [ "$status" = "clean" ] && [ "${SUITES_EXIT:-1}" = "0" ]; then
            exit 0
          fi
          echo "::error::monitoring failed (verdict=$status, suites exit=${SUITES_EXIT:-unknown})"
          exit 1
